{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card narrow">
  <h1>Log in</h1>
  {% if next %}<p class="notice">Please log in to continue.</p>{% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include 'includes/form_fields.html' %}
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
</div>
{% endblock %}
